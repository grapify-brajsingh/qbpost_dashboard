# ${API_UPSTREAM} is substituted by the nginx image's envsubst step at start-up.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # One PDF upload is at most 10 MB (R-13.2); allow a little multipart overhead.
    client_max_body_size 11m;

    # Docker's DNS, re-asked every 10 s, so a recreated API container is found again without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A post may take minutes and must never be cut off (R-3); an extraction waits up to 120 s (R-13.11).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        try_files $uri /index.html;
    }
}
